name: Refresh Preview guide
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['*.py', 'catalog.json', '.github/workflows/refresh.yml']
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: read
concurrency:
  group: preview-guide-publication
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check importer
        run: python3 -m unittest test_builder -q
      - name: Build and validate current guide
        run: python3 build_snapshot.py --previous https://sidneytambin-maker.github.io/uk-tv-listings-preview-data --output site
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site
          retention-days: 1
      - name: Publish validated guide
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Record daily successful refresh
        run: |
          python3 - <<'PY'
          import datetime,pathlib
          pathlib.Path('last-successful-day.txt').write_text(datetime.datetime.now(datetime.timezone.utc).date().isoformat()+'\n')
          PY
          if ! git diff --quiet -- last-successful-day.txt || [ -n "$(git ls-files --others --exclude-standard last-successful-day.txt)" ]; then
            git config user.name 'UK TV Listings refresh'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add last-successful-day.txt
            git commit -m 'Record successful Preview guide refresh'
            git push
          fi
